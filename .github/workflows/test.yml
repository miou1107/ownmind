name: test

# Why this exists: before it, `.github/` held only CODEOWNERS - the repo had no CI at all.
# Tests ran only on whichever machine someone happened to run them on, and the Windows-only
# paths were either skipped on macOS or never reached. On a Mac, a test that fails on Windows
# is not a failing test, it is an invisible one. Every one of the four v1.26.104 bugs survived
# that way; the UTF-16 log bug shipped from 2026-05-09 until it was dug out by hand.
#
# This workflow touches nothing outside the runner: no server, no deploy credentials, no
# knowledge of where the server is. Changing hosting providers does not affect it.

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

# This repo ships several versions a day. Without this, pushes queue behind each other.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  # The platforms that get a veto. node 20 is what the Dockerfile runs in production;
  # node 24 is what the dev machine runs, and it catches "only breaks on newer node".
  #
  # Windows joined this matrix on 2026-08-16. It ran as a separate non-blocking job from
  # 2026-08-13, was red on every single run in between, and every release in that window
  # reported success anyway - which is the failure mode the whole job existed to prevent.
  # What kept it red was one product defect (the path guard read a file as belonging to no
  # repository whenever git and the caller spelled the same directory differently, and
  # allowed the edit) and one test-harness defect (a Windows-container docker daemon answers
  # `docker info` and then cannot run a Linux image, so the database files threw instead of
  # skipping). Neither would have been found by a leg nobody had to look at.
  test:
    name: ${{ matrix.os }} / node ${{ matrix.node }}
    runs-on: ${{ matrix.os }}
    timeout-minutes: 20
    strategy:
      fail-fast: false # one platform going red must not cancel the others - per-platform results are the point
      matrix:
        include:
          - { os: ubuntu-latest, node: '20' }
          - { os: ubuntu-latest, node: '24' }
          - { os: macos-latest, node: '20' }
          - { os: windows-latest, node: '20' }
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node }}
          cache: npm
      - run: npm ci
      # `src/public/dashboard/` is gitignored, so a fresh clone has no console and the
      # routing tests get a 404 where the SPA shell should be. This is the same step
      # `npm start` runs as `prestart`, and it uses build:no-translate - the full build
      # runs an LLM translation pass that needs credentials CI does not have.
      - run: node scripts/ensure-console-build.js
      # npm test = lint:zh-only + node --test. A handful of test files DO stand up a real
      # Postgres, via tests/helpers/real-db.js (docker run pgvector). They skip by name when
      # docker is unavailable rather than passing quietly, so the ubuntu legs — which have
      # docker — are where those assertions actually run; the macOS and Windows legs report
      # them as skips.
      #
      # The runner carries --test-timeout so that a file which never finishes is named and
      # fails, instead of consuming the whole timeout-minutes budget in silence. On
      # 2026-08-09 the macOS leg did exactly that twice: 20 minutes, zero output, and a
      # conclusion of "cancelled" that reads like somebody pressed a button. See package.json.
      - run: npm test

  # Does a person who has installed nothing end up with a working install?
  #
  # 356 test files, 26 of them naming install.sh, and not one that ran it. Every piece was
  # covered and the thing users actually execute was not, which is how a machine can report
  # "the tool is not registered" while the suite stays green. This runs the real installer
  # into a throwaway home and then asks each feature whether it works.
  #
  # Separate from `test` so its result reads on its own: "the code is fine but installing it
  # is not" is a different message from "the code is broken", and a leg buried in a matrix
  # of four cannot say it.
  install:
    name: clean install / ${{ matrix.os }}
    runs-on: ${{ matrix.os }}
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: npm
      - run: npm ci
      - run: node --test --test-timeout=900000 tests/install-clean-machine.e2e.mjs
