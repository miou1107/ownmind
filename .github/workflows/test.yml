name: test

# 為什麼有這支：在這之前 repo 完全沒有 CI，測試只在有人手動跑的機器上跑。
# 在 Mac 上，一個只會在 Windows 壞的測試不是「失敗的測試」，是「看不見的測試」——
# v1.26.104 那四個問題全都是這樣活下來的，其中一個從 2026-05-09 活到被翻出來為止。
#
# 這支只做一件事：跑 npm test 並回報結果。它不碰伺服器、沒有任何部署權限、
# 也不知道伺服器在哪。換主機不會影響它。

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

# 同一個分支連續 push 時，取消還在跑的舊的。這個 repo 一天發好幾版，不這樣做會排隊。
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    name: ${{ matrix.os }} / node ${{ matrix.node }}
    runs-on: ${{ matrix.os }}
    timeout-minutes: 20

    # Windows 先設成不擋合併。理由：這支剛開起來時 Windows 上有一批既有的紅，
    # 大多是環境問題（那台機器上 node 找不到 bash）而不是程式碼問題。
    # 使用者是從 main 自動拉更新的，合併等於出貨，所以在紅清乾淨之前不能讓它卡住出貨。
    # 清乾淨之後把這行拿掉，Windows 就跟其他平台一樣具有否決權。
    continue-on-error: ${{ matrix.soft-fail }}

    strategy:
      fail-fast: false # 一個平台紅，其他平台照跑完——重點就是看每個平台各自的結果
      matrix:
        # node 20 = Dockerfile 裡的正式環境版本
        os: [ubuntu-latest, macos-latest]
        node: ['20']
        soft-fail: [false]
        include:
          # Windows：會跑、會顯示、但不擋合併（理由見上面 continue-on-error）
          - os: windows-latest
            node: '20'
            soft-fail: true
          # node 24 = 開發機上的版本，只在 ubuntu 上跑一份，抓「新版 node 才會有的差異」
          - os: ubuntu-latest
            node: '24'
            soft-fail: false

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node }}
          cache: npm

      - run: npm ci

      # npm test = lint:zh-only + node --test（257 個測試檔，沒有一個需要資料庫）
      - run: npm test

  # Windows 設了 continue-on-error 之後，整個 workflow 一定是綠的，
  # 分支保護就沒東西可以掛。這個 job 專門用來當那個掛勾：
  # 只要 ubuntu 或 macOS 紅，它就紅。
  required:
    name: required platforms
    runs-on: ubuntu-latest
    needs: test
    if: always()
    steps:
      - name: fail if a required platform failed
        run: |
          echo "test job result: ${{ needs.test.result }}"
          if [ "${{ needs.test.result }}" != "success" ]; then
            echo "::error::ubuntu 或 macOS 沒過（Windows 目前不擋，見 matrix 註解）"
            exit 1
          fi
