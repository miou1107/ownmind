name: daily install check

# Does a person installing OwnMind today end up with a working install?
#
# The `install` job in test.yml answers that for a change somebody is making. This answers it
# for a day nobody changed anything, which is a different question and the one that was going
# unasked: a machine reported "the tool is not registered in the file Claude Code reads" for
# days while every check was green, because nothing was standing between the release and the
# user asking whether the install still worked.
#
# It can also go red without a commit, and that is the point - npm, GitHub, and the runner
# images all move underneath us.
#
# On failure it opens one issue and keeps commenting on that issue rather than opening a new
# one each morning. A daily alert that becomes a wall of duplicates is an alert nobody reads,
# which is the state this workflow exists to end.

on:
  schedule:
    # 01:00 UTC = 09:00 Taipei, so a failure is waiting at the start of the day rather than
    # discovered at the end of it.
    - cron: '0 1 * * *'
  workflow_dispatch:
    inputs:
      drill:
        description: 'Fail on purpose, to check the alert still reaches somebody'
        type: boolean
        default: false

# An alerting path nobody has ever seen fire is an alerting path nobody has evidence about,
# and the way it usually fails is by staying silent - which is indistinguishable from a quiet
# week. `drill` makes the failure branch runnable on demand: run this workflow with it on, and
# an issue should appear. Close the issue afterwards; nothing else needs undoing.

# Read-only by default; the one job that needs to write says so itself, so the three real
# installs run with a token that cannot open anything.
permissions:
  contents: read

jobs:
  install:
    name: clean install / ${{ matrix.os }}
    runs-on: ${{ matrix.os }}
    timeout-minutes: 25
    strategy:
      fail-fast: false # which platforms broke is the whole content of the answer
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    steps:
      - uses: actions/checkout@v4
      # The drill fails before anything is installed, on purpose. What is being exercised is
      # the half nobody sees on a good day - whether a failure still reaches a person - and
      # spending twenty minutes on three real installs to answer that would make the drill
      # something nobody runs.
      - if: inputs.drill
        run: |
          echo "Drill: failing on purpose to check that the alert still reaches somebody."
          exit 1
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: npm
      - run: npm ci
      - run: node --test --test-timeout=900000 tests/install-clean-machine.e2e.mjs

  report:
    name: tell somebody
    needs: install
    # `always()` because the interesting case is the one where the job above failed, and
    # `failure()` alone would also skip this when the matrix was cancelled.
    if: always() && needs.install.result != 'success'
    runs-on: ubuntu-latest
    permissions:
      contents: read
      issues: write
    steps:
      - env:
          GH_TOKEN: ${{ github.token }}
          REPO: ${{ github.repository }}
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
          RESULT: ${{ needs.install.result }}
        shell: bash
        run: |
          # Deliberately not `set -e`. This step exists so a failure reaches a person, and a
          # rate-limited `gh issue list` under `set -e` would end the step right there - no
          # issue, no comment, and a silent morning that looks exactly like a healthy one.
          # Every command below decides for itself what to do when it fails.
          set -uo pipefail
          TITLE="Installing OwnMind is broken"
          BODY=$(cat <<EOF
          The daily check installed OwnMind onto a machine with nothing on it, then asked each
          feature whether it works. Something answered no ($RESULT).

          Anyone who installs OwnMind today may end up with a feature that is quietly absent —
          the kind that leaves the tool registered but not starting, or a rule that no longer
          blocks anything.

          What broke, and on which platform: $RUN_URL

          This issue stays open and collects a comment each day it keeps failing. It does not
          close itself — close it once the check is green again.
          EOF
          )

          # An empty answer here has two meanings - no open issue, or the lookup failed - and
          # they call for the same response: say something. A duplicate issue is noise; a
          # silent failure is the thing this workflow was built to stop.
          EXISTING=$(gh issue list --repo "$REPO" --state open --label install-broken \
            --json number --jq '.[0].number // empty' 2>/dev/null || true)

          if [ -n "$EXISTING" ] && gh issue comment "$EXISTING" --repo "$REPO" \
               --body "Still failing ($RESULT): $RUN_URL"; then
            echo "commented on #$EXISTING"
            exit 0
          fi

          # The label has to exist before it can be applied, and a missing label must not be
          # what stops the alert.
          gh label create install-broken --repo "$REPO" \
            --description "The daily clean-install check is failing" --color B60205 2>/dev/null || true
          if ! gh issue create --repo "$REPO" --title "$TITLE" --body "$BODY" --label install-broken; then
            gh issue create --repo "$REPO" --title "$TITLE" --body "$BODY" || {
              echo "::error::the clean install failed and this step could not open an issue about it"
              exit 1
            }
          fi
